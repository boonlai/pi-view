name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out tagged commit or main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
      - name: Check release prerequisites
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/verify-release.mjs
      - name: Install dependencies
        run: npm ci
      - name: Check and rebuild committed dist
        run: |
          npm run check
          npm run build
          node ci/check-dist.mjs
      - name: Pack and test the installed archive
        run: node ci/pack-release.mjs
      - name: Upload tested archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/pi-view-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm and GitHub
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Install npm for trusted publishing
        run: |
          npm install --global npm@12.1.0
          npm_version="$(npm --version)"
          test "$npm_version" = "12.1.0"
          echo "npm $npm_version"
      - name: Download tested archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/pi-view-release
      - name: Verify archive checksum
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/pi-view-release"
          archives=("$dir"/*.tgz)
          checksums=("$dir"/*.tgz.sha256)
          [[ ${#archives[@]} -eq 1 && -f ${archives[0]} ]]
          [[ ${#checksums[@]} -eq 1 && -f ${checksums[0]} ]]
          archive_name="${archives[0]##*/}"
          [[ ${checksums[0]##*/} == "$archive_name.sha256" ]]
          read -r digest listed_name < "${checksums[0]}"
          [[ $digest =~ ^[[:xdigit:]]{64}$ && $listed_name == "$archive_name" ]]
          (cd "$dir" && sha256sum --check -- "$archive_name.sha256")
          echo "tarball=${archives[0]}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksums[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish tested archive
        env:
          ARCHIVE: ${{ steps.archive.outputs.tarball }}
        run: npm publish "$ARCHIVE" --registry=https://registry.npmjs.org --provenance --access public
      - name: Create GitHub release with tested assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outputs.tarball }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$CHECKSUM" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
